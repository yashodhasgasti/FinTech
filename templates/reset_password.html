<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NexaPay — Set New Password</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/style.css">
  <style>
    .auth-body {
      margin: 0;
      padding: 0;
      min-height: 100vh;
      background: radial-gradient(circle at 15% 20%, rgba(30, 58, 138, 0.35) 0%, transparent 45%),
                  radial-gradient(circle at 85% 80%, rgba(6, 182, 212, 0.20) 0%, transparent 45%),
                  #070b14;
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      color: #f1f5f9;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      box-sizing: border-box;
      position: relative;
    }

    .auth-bg-grid {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-image: linear-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px),
                        linear-gradient(90deg, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
      background-size: 40px 40px;
      pointer-events: none;
      z-index: 0;
    }

    .auth-container {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 460px;
      margin: auto;
    }

    .auth-card {
      background: rgba(13, 21, 39, 0.88);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.09);
      border-radius: 20px;
      padding: 40px 36px;
      box-shadow: 0 25px 60px -15px rgba(0, 0, 0, 0.7);
    }

    .auth-header {
      text-align: center;
      margin-bottom: 24px;
    }

    .brand-logo-wrap {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 58px;
      height: 58px;
      border-radius: 16px;
      background: linear-gradient(135deg, rgba(37, 99, 235, 0.25), rgba(6, 182, 212, 0.25));
      border: 1px solid rgba(59, 130, 246, 0.4);
      margin-bottom: 16px;
      font-size: 1.8rem;
    }

    .auth-title {
      font-size: 1.55rem;
      font-weight: 800;
      color: #ffffff;
      margin: 0 0 8px 0;
    }

    .auth-subtitle {
      font-size: 0.90rem;
      color: #94a3b8;
      margin: 0;
      line-height: 1.45;
    }

    .form-group-auth {
      margin-bottom: 20px;
    }

    .form-label-auth {
      display: block;
      font-size: 0.84rem;
      font-weight: 600;
      color: #cbd5e1;
      margin-bottom: 8px;
    }

    .input-wrapper-auth {
      position: relative;
      display: flex;
      align-items: center;
    }

    .input-icon-auth {
      position: absolute;
      left: 14px;
      font-size: 1.05rem;
      color: #64748b;
      pointer-events: none;
    }

    .form-control-auth {
      width: 100%;
      background: rgba(15, 23, 42, 0.7);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 12px;
      padding: 12px 14px 12px 42px;
      font-size: 0.92rem;
      color: #ffffff;
      outline: none;
      box-sizing: border-box;
      font-family: inherit;
    }

    .form-control-auth:focus {
      border-color: #3b82f6;
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.25);
    }

    .pwd-toggle-btn {
      position: absolute;
      right: 12px;
      background: none;
      border: none;
      color: #94a3b8;
      cursor: pointer;
      padding: 4px;
      font-size: 1.1rem;
      line-height: 1;
    }

    .btn-auth-submit {
      width: 100%;
      background: linear-gradient(135deg, #2563eb, #1d4ed8);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 12px;
      padding: 13px 20px;
      font-size: 0.96rem;
      font-weight: 700;
      color: #ffffff;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-shadow: 0 4px 18px rgba(37, 99, 235, 0.4);
      font-family: inherit;
    }

    .auth-alert {
      padding: 12px 16px;
      border-radius: 10px;
      margin-bottom: 20px;
      font-size: 0.86rem;
      display: flex;
      align-items: center;
      gap: 10px;
      line-height: 1.4;
    }

    .auth-alert-error {
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid rgba(239, 68, 68, 0.35);
      color: #fca5a5;
    }

    .auth-footer {
      text-align: center;
      margin-top: 24px;
      font-size: 0.88rem;
      color: #94a3b8;
    }

    .auth-footer a {
      color: #60a5fa;
      text-decoration: none;
      font-weight: 700;
      margin-left: 4px;
    }
  </style>
</head>
<body class="auth-body">
  <div class="auth-bg-grid"></div>

  <div class="auth-container">
    <div class="auth-card">
      <div class="auth-header">
        <div class="brand-logo-wrap">🔒</div>
        <h1 class="auth-title">Set New Password</h1>
        <p class="auth-subtitle">Enter your new secure password below to regain full access.</p>
      </div>

      {% if error %}
      <div class="auth-alert auth-alert-error">
        <span>⚠️</span>
        <span>{{ error }}</span>
      </div>
      {% endif %}

      <form id="form-reset" method="POST" action="/reset-password">
        <input type="hidden" name="token" value="{{ token or '' }}">

        <div class="form-group-auth">
          <label class="form-label-auth" for="new-password">New Password</label>
          <div class="input-wrapper-auth">
            <span class="input-icon-auth">🔒</span>
            <input 
              type="password" 
              id="new-password" 
              name="new_password" 
              class="form-control-auth" 
              placeholder="Min 6 characters" 
              required 
              autocomplete="new-password"
            >
            <button 
              type="button" 
              class="pwd-toggle-btn" 
              onclick="togglePasswordVisibility('new-password', this)"
            >
              👁️
            </button>
          </div>
        </div>

        <div class="form-group-auth">
          <label class="form-label-auth" for="confirm-new-password">Confirm New Password</label>
          <div class="input-wrapper-auth">
            <span class="input-icon-auth">🔒</span>
            <input 
              type="password" 
              id="confirm-new-password" 
              name="confirm_password" 
              class="form-control-auth" 
              placeholder="Re-enter new password" 
              required 
              autocomplete="new-password"
            >
            <button 
              type="button" 
              class="pwd-toggle-btn" 
              onclick="togglePasswordVisibility('confirm-new-password', this)"
            >
              👁️
            </button>
          </div>
        </div>

        <button type="submit" class="btn-auth-submit" id="btn-reset-submit">
          Update Password & Sign In 🚀
        </button>
      </form>

      <div class="auth-footer">
        Back to 
        <a href="/login">Sign In</a>
      </div>
    </div>
  </div>

  <script>
    function togglePasswordVisibility(inputId, btn) {
      const input = document.getElementById(inputId);
      if (input.type === "password") {
        input.type = "text";
        btn.textContent = "🙈";
      } else {
        input.type = "password";
        btn.textContent = "👁️";
      }
    }
  </script>
</body>
</html>
